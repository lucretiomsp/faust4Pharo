name: Build Dynamic Engine
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-library:
    runs-on: ubuntu-20.04  # Older Ubuntu for better glibc compatibility
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            g++ \
            cmake \
            pkg-config \
            patchelf \
            libasound2-dev \
            libpulse-dev \
            libjack-jackd2-dev \
            autoconf \
            automake \
            libtool \
            wget
      
      - name: Build static libsndfile and dependencies
        run: |
          mkdir -p $HOME/static-libs
          
          # Build libogg
          wget https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz
          tar xzf libogg-1.3.5.tar.gz
          cd libogg-1.3.5
          ./configure --prefix=$HOME/static-libs --enable-static --disable-shared
          make -j$(nproc)
          make install
          cd ..
          
          # Build libvorbis
          wget https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.gz
          tar xzf libvorbis-1.3.7.tar.gz
          cd libvorbis-1.3.7
          ./configure --prefix=$HOME/static-libs --enable-static --disable-shared \
            --with-ogg=$HOME/static-libs
          make -j$(nproc)
          make install
          cd ..
          
          # Build FLAC
          wget https://downloads.xiph.org/releases/flac/flac-1.4.2.tar.xz
          tar xf flac-1.4.2.tar.xz
          cd flac-1.4.2
          ./configure --prefix=$HOME/static-libs --enable-static --disable-shared \
            --with-ogg=$HOME/static-libs --disable-programs
          make -j$(nproc)
          make install
          cd ..
          
          # Build libsndfile
          wget https://github.com/libsndfile/libsndfile/releases/download/1.2.2/libsndfile-1.2.2.tar.xz
          tar xf libsndfile-1.2.2.tar.xz
          cd libsndfile-1.2.2
          PKG_CONFIG_PATH=$HOME/static-libs/lib/pkgconfig \
            ./configure --prefix=$HOME/static-libs --enable-static --disable-shared
          make -j$(nproc)
          make install
          cd ..
      
      - name: Build Dynamic Engine Library
        working-directory: builDynEng
        run: |
          # Set up environment to use static libs
          export PKG_CONFIG_PATH=$HOME/static-libs/lib/pkgconfig:$PKG_CONFIG_PATH
          export LDFLAGS="-L$HOME/static-libs/lib -static-libgcc -static-libstdc++"
          export CPPFLAGS="-I$HOME/static-libs/include"
          
          # Build with static libsndfile
          make LDFLAGS="$LDFLAGS" CPPFLAGS="$CPPFLAGS"
      
      - name: Verify static linking
