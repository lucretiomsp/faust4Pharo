name: Build Dynamic Engine
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-library:
    runs-on: ubuntu-20.04
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential g++ cmake pkg-config patchelf zip \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            autoconf automake libtool wget

      - name: Build static libsndfile and dependencies
        run: |
          mkdir -p $HOME/static-libs
          
          # libogg
          wget https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz
          tar xzf libogg-1.3.5.tar.gz
          cd libogg-1.3.5
          ./configure --prefix=$HOME/static-libs --enable-static --disable-shared
          make -j$(nproc) && make install
          cd ..

          # libvorbis
          wget https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.gz
          tar xzf libvorbis-1.3.7.tar.gz
          cd libvorbis-1.3.7
          ./configure --prefix=$HOME/static-libs --enable-static --disable-shared --with-ogg=$HOME/static-libs
          make -j$(nproc) && make install
          cd ..

          # FLAC
          wget https://downloads.xiph.org/releases/flac/flac-1.4.2.tar.xz
          tar xf flac-1.4.2.tar.xz
          cd flac-1.4.2
          ./configure --prefix=$HOME/static-libs --enable-static --disable-shared --with-ogg=$HOME/static-libs --disable-programs
          make -j$(nproc) && make install
          cd ..

          # libsndfile
          wget https://github.com/libsndfile/libsndfile/releases/download/1.2.2/libsndfile-1.2.2.tar.xz
          tar xf libsndfile-1.2.2.tar.xz
          cd libsndfile-1.2.2
          PKG_CONFIG_PATH=$HOME/static-libs/lib/pkgconfig ./configure --prefix=$HOME/static-libs --enable-static --disable-shared
          make -j$(nproc) && make install
          cd ..

      - name: Build Dynamic Engine Library
        working-directory: builDynEng
        run: |
          export PKG_CONFIG_PATH=$HOME/static-libs/lib/pkgconfig:$PKG_CONFIG_PATH
          export LDFLAGS="-L$HOME/static-libs/lib -static-libgcc -static-libstdc++"
          export CPPFLAGS="-I$HOME/static-libs/include"
          make LDFLAGS="$LDFLAGS" CPPFLAGS="$CPPFLAGS"

      - name: Verify static linking
        run: |
          echo "Checking library dependencies:"
          ldd librariesLinux/libdynamic-engine.so
          echo ""
          if ldd librariesLinux/lib/libdynamic-engine.so | grep -q "libsndfile"; then
            echo "❌ libsndfile is dynamically linked!"
            exit 1
          else
            echo "✅ libsndfile is statically linked"
          fi

      - name: Strip and set RPATH
        run: |
          strip --strip-unneeded librariesLinux/libdynamic-engine.so
          patchelf --set-rpath '$ORIGIN' librariesLinux/lib/libdynamic-engine.so || true

      - name: Create distribution package
        run: |
          mkdir -p dist/lib
          cp librariesLinux/libdynamic-engine.so dist/lib/
          
          # Bundle non-system dynamic dependencies
          echo "Checking for libraries to bundle..."
          ldd librariesLinux/libdynamic-engine.so | grep "=> /" | awk '{print $3}' | grep -v "^/lib" | grep -v "^/usr/lib" | while read lib; do
            echo "Bundling: $lib"
            cp "$lib" dist/lib/
          done || true

          # Build info
          echo "Build Date: $(date -u +%Y-%m-%d)" > dist/BUILD_INFO.txt
          echo "Git Commit: ${GITHUB_SHA:0:8}" >> dist/BUILD_INFO.txt
          echo "Platform: Linux x86_64" >> dist/BUILD_INFO.txt

      - name: Verify compiled library
        run: |
          if [ -f dist/lib/libdynamic-engine.so ]; then
            echo "✅ libdynamic-engine.so successfully built"
            ls -lh dist/lib/libdynamic-engine.so
          else
            echo "❌ libdynamic-engine.so not found!"
            exit 1
          fi

      - name: Create ZIP file
        run: |
          cd dist
          zip -r ../dynamic-engine-linux-x64.zip *
          cd ..
          ls -lh dynamic-engine-linux-x64.zip

      - name: Upload library ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-engine-linux-x64
          path: dynamic-engine-linux-x64.zip

      - name: Upload libdynamic-engine.so separately
        uses: actions/upload-artifact@v4
        with:
          name: libdynamic-engine.so
          path: dist/lib/libdynamic-engine.so
