name: Build Dynamic Engine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential g++ patchelf

      - name: Build Dynamic Engine Library
        working-directory: builDynEng
        run: make

      - name: List build output (diagnostic)
        run: ls -R librariesLinux

      - name: Verify compiled library
        run: |
          if [ -f librariesLinux/libdynamic-engine.so ]; then
            echo "✅ libdynamic-engine.so successfully built"
          else
            echo "❌ libdynamic-engine.so not found!"
            exit 1
          fi

      - name: Upload library artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-engine-library
          path: librariesLinux/libdynamic-engine.so
