name: Build Linux Distribution

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create distribution package
        run: |
          set -e

          mkdir -p dist/lib
          cp librariesLinux/libdynamic-engine.so dist/lib/

          echo "Checking for libraries to bundle..."
          for lib in $(ldd librariesLinux/libdynamic-engine.so | awk '/=> \// {print $3}' | grep -v '^/lib' | grep -v '^/usr/lib'); do
            echo "Bundling: $lib"
            cp "$lib" dist/lib/
          done || true

          echo "# Dynamic Engine Library" > dist/README.md
          echo "" >> dist/README.md
          echo "## System Requirements" >> dist/README.md
          echo "- Linux with ALSA/PulseAudio support" >> dist/README.md
          echo "- x86_64 architecture" >> dist/README.md

          echo "Build Date: $(date -u +%Y-%m-%d)" > dist/BUILD_INFO.txt
          echo "Git Commit: ${GITHUB_SHA:0:8}" >> dist/BUILD_INFO.txt
          echo "Platform: Linux x86_64" >> dist/BUILD_INFO.txt

          ls -lh dist/lib/
